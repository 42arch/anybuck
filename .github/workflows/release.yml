name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: --bundles deb,appimage

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 设置 Node.js 环境（tauri-action 运行依赖 Node 运行时）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 2. 设置 Bun 包管理器
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. 安装 Rust 稳定版工具链
      # 构建 macOS 通用二进制时需同时安装 aarch64 与 x86_64 target
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 4. 缓存 Rust 构建产物，提升重复构建速度
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # 5. Linux 环境依赖安装（WebKitGTK 4.1 与系统 Secret Service 库）
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev

      # 6. 安装前端依赖
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # 7. 从 CHANGELOG.md 提取最新版本的更新内容
      - name: Extract Changelog Entry
        id: changelog
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            let notes = "See CHANGELOG.md for details.";
            if (fs.existsSync("CHANGELOG.md")) {
              const content = fs.readFileSync("CHANGELOG.md", "utf8");
              const lines = content.split(/\r?\n/);
              const startIndex = lines.findIndex(line => /^##\s+/.test(line));
              if (startIndex !== -1) {
                const nextIndex = lines.slice(startIndex + 1).findIndex(line => /^##\s+/.test(line));
                const endIndex = nextIndex !== -1 ? startIndex + 1 + nextIndex : lines.length;
                const section = lines.slice(startIndex + 1, endIndex).join("\n").trim();
                if (section) {
                  notes = section;
                }
              }
            }
            const delimiter = `EOF_${Date.now()}`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changes<<${delimiter}\n${notes}\n${delimiter}\n`);
          '

      # 8. 打包并将产物上传至 GitHub Release
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Cloudstore v__VERSION__
          releaseBody: ${{ steps.changelog.outputs.changes }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
